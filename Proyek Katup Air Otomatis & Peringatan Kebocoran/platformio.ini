[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:load_env.py
build_flags = 
    -D MQTT_MAX_PACKET_SIZE=512
lib_deps = 
    madhephaestus/ESP32Servo @ ^3.0.5
    knolleary/PubSubClient @ ^2.8
    https://github.com/ubidots/esp32-mqtt.git
